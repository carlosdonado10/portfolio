# Backstop for the local hooks: `git commit --no-verify` skips pre-commit locally,
# but it can't skip this. Same config, same pinned tool versions (uv.lock).
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # The eslint and knip hooks run through pnpm.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run all hooks
        # no-commit-to-branch only makes sense for local commits.
        env:
          SKIP: no-commit-to-branch
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run test
      - run: pnpm -r --if-present run build
