# Example project: a stdlib HTTP server that turns healthy 2s after start.
# Contract (docs/adding-a-project.md): entry service on the external network
# orch-stacks with alias <id>-entry, no published host ports.
services:
  web:
    build: .
    image: orch-example-fastocal
    environment:
      PROJECT_ID: fast
      READY_AFTER_S: "2"
    networks:
      orch-stacks:
        aliases: [fast-entry]

networks:
  orch-stacks:
    external: true
