[project]
name = "agent"
version = "0.1.0"
description = "Portfolio platform privileged host agent (control tier). Stdlib only for now; Docker SDK + ML-app-repo management land in WS3."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
