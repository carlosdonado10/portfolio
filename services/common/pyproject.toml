[project]
name = "orch-common"
version = "0.1.0"
description = "Shared orchestrator package: manifest model, wire schemas and the orchctl CLI."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
]

[project.scripts]
orchctl = "orch_common.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_common"]
