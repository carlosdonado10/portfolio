[project]
name = "control-plane"
version = "0.1.0"
description = "Portfolio platform control-plane API (FastAPI). Web-facing; never touches the Docker socket."
requires-python = ">=3.13"
dependencies = [
    "orch-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx",
    "itsdangerous",
    "email-validator",
]

[tool.uv.sources]
orch-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]
