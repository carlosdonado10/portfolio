# uv **virtual** workspace root — this root ships no code, so it has no [project].
# It exists only to bind the Python services into one uv workspace with a single
# shared lockfile (uv.lock) and one shared .venv.
#
# Members:
#   services/control-plane — FastAPI web API (control tier)
#   services/agent         — privileged host agent (control tier)
#
# The frontend (apps/*) and shared JS packages (packages/*) are a *separate*
# pnpm workspace — see pnpm-workspace.yaml. Python version is pinned in
# .python-version and each member's requires-python.
[tool.uv.workspace]
members = ["services/control-plane", "services/agent"]

# Repo-wide quality tooling. The pre-commit hooks run these through `uv run`, so
# the versions here (pinned in uv.lock) are the single source of truth for local
# hooks and CI alike.
[dependency-groups]
dev = [
    "black>=25.1",
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
    "pre-commit>=4",
    "vulture>=2.14",
]

# --- black: the formatter ---------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py313"]

# --- ruff: the linter (formatting is black's job) ---------------------------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "S",        # bandit (security)
    "RUF",
]
# E501: black owns line length.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # assert is how pytest works

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = ["services/control-plane/src", "services/agent/src"]
explicit_package_bases = true

# --- pytest + coverage ------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["services"]
addopts = "--import-mode=importlib -m 'not integration'"
asyncio_mode = "auto"
markers = ["integration: needs a real Docker daemon (run with -m integration)"]

[tool.coverage.run]
branch = true
source = ["control_plane", "agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

# --- vulture: dead-code detection ------------------------------------------
[tool.vulture]
paths = ["services"]
# 60 catches unused functions/classes, not just imports (ruff already covers those).
min_confidence = 60
# Framework-dispatched callables look unused to static analysis.
ignore_decorators = [
    "@*.get", "@*.post", "@*.put", "@*.patch", "@*.delete",
    "@*.middleware", "@*.exception_handler", "@pytest.fixture",
]
