# Gateway for the orchestrator. One public listener (:80 in the container).
#   /lab/         static lab UI (built into this image)
#   /api/         control-plane public API (SSE on /api/events)
#   /p/<id>/      project stacks, gated per request (generated/*.conf)
# /internal/ and /agent/ exist on the control-plane but are never public.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    # Websocket upgrade support for proxied projects (see snippets/project-proxy.conf).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # Project upstreams never see the orchestrator's cookies (orch_sid, and any
    # legacy Path=/ orch_admin): project JS could otherwise act as the visitor or
    # the owner. A map can't replace globally, so each map strips one cookie.
    # The gate location still forwards the full $http_cookie (it needs orch_sid).
    map $http_cookie $project_cookie_1 {
        default $http_cookie;
        "~^(.*?)\borch_[a-z]+=[^;]*;?\s*(.*)$" "$1$2";
    }
    map $project_cookie_1 $project_cookie {
        default $project_cookie_1;
        "~^(.*?)\borch_[a-z]+=[^;]*;?\s*(.*)$" "$1$2";
    }

    # Behind a TLS front proxy on the host, trust its X-Forwarded-For so
    # $remote_addr (and the X-Real-IP the control-plane rate-limits on) is the
    # visitor, not the front proxy. Uncomment and set the front proxy's address
    # as seen from this container (the docker bridge gateway, e.g. 172.17.0.1):
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        # Redirects stay relative: the container's :80 is not the published port.
        absolute_redirect off;

        # Docker's embedded DNS. Project stacks come and go, so their aliases
        # are resolved per request (variable proxy_pass), never at startup.
        resolver 127.0.0.11 valid=2s ipv6=off;

        # Never public: control-plane internals and the agent API.
        location /internal/ { return 404; }
        location /agent/    { return 404; }

        # The root is unassigned; send visitors to the lab.
        location = / { return 302 /lab/; }

        location /lab/ {
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri /lab/index.html;
        }

        location /api/ {
            include /etc/nginx/snippets/security-headers.conf;
            set $control_plane http://control-plane:8000;
            proxy_pass $control_plane;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Overwrites any client-sent value: the control-plane rate-limits on it.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE on /api/events must not be buffered, cached or cut after 60s.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        # Per-project gate + proxy blocks written by `orchctl render-nginx`.
        include /etc/nginx/generated/*.conf;

        location / { return 404; }
    }
}
