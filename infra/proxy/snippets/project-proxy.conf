# Shared by every generated /p/<id>/ location (see `orchctl render-nginx`).
proxy_http_version 1.1;
proxy_set_header Host $host;
# Overwrites any client-sent value: the control-plane rate-limits on it.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# The visitor's cookies minus orch_* (see the maps in nginx.conf).
proxy_set_header Cookie $project_cookie;

# Websockets.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 1h;

# Inject the notify-client into HTML pages. sub_filter cannot rewrite a
# compressed body, so ask the upstream for an identity-encoded one.
proxy_set_header Accept-Encoding "";
sub_filter '</body>' '<script src="/lab/notify.js" defer></script></body>';
sub_filter_once on;
sub_filter_types text/html;
